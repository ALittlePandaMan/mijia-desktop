[package]
name = "mijia-desktop"
version = "0.1.0"
description = "Cross-platform desktop client for Xiaomi Home"
edition = "2021"
rust-version = "1.98"
license = "MIT"

[lib]
name = "mijia_desktop"
crate-type = ["rlib"]

[[bin]]
name = "mijia-desktop"
path = "src/main.rs"
required-features = ["desktop"]

[[bin]]
name = "mijia-media-probe"
path = "src/media_probe.rs"
required-features = ["media-probe"]

[features]
default = ["desktop"]
desktop = ["dep:embed-resource", "dep:tauri", "dep:tauri-build", "dep:tauri-plugin-dialog", "dep:tauri-plugin-autostart", "dep:tauri-plugin-single-instance", "dep:tauri-plugin-updater", "dep:semver", "dep:minisign-verify", "dep:zip", "dep:tauri-plugin-wallpaper", "dep:webview2-com"]
ui-inspect = ["desktop"]
media-probe = ["ui-inspect", "tauri/custom-protocol"]

[build-dependencies]
embed-resource = { version = "=3.0.12", optional = true }
tauri-build = { version = "2.7.4", optional = true, features = [] }

[dependencies]
tauri = { version = "2.12.5", optional = true, features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls", "json", "cookies"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
base64 = "0.22"
sha1 = "0.10"
sha2 = "0.10"
rand = "0.8"
url = "2"
uuid = { version = "1", features = ["v4"] }
keyring = { version = "3.6.3", default-features = false }
dirs = "=7.0.0"
tauri-plugin-dialog = { version = "=2.8.4", optional = true }
tauri-plugin-autostart = { version = "2", optional = true }
tauri-plugin-single-instance = { version = "2", optional = true }
tauri-plugin-updater = { version = "=2.14.1", optional = true }
semver = { version = "1", optional = true }
minisign-verify = { version = "0.3", optional = true }
zip = { version = "9", default-features = false, features = ["deflate"], optional = true }
rmcp = { version = "=3.9.0", features = ["server", "transport-streamable-http-server"] }
axum = "0.8"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-util = { version = "0.7", features = ["rt"] }
schemars = "1"
subtle = "2"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
zeroize = "1"
ring = "0.17.14"
salsa20 = "0.10.2"
chacha20 = "0.9.1"
flate2 = "1"
aes = "0.8.4"
cbc = { version = "0.1.2", features = ["alloc"] }
md-5 = "0.10"
chrono = { version = "=0.4.45", default-features = false, features = ["clock", "std"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6.3", features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6.3", features = ["sync-secret-service", "crypto-rust"] }

[target.'cfg(windows)'.dependencies]
webview2-com = { version = "=0.39.1", optional = true }
tauri-plugin-wallpaper = { version = "=4.1.0", optional = true }
keyring = { version = "3.6.3", features = ["windows-native"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_NetworkManagement_WiFi", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock", "Win32_UI_Controls_Dialogs", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_System_Com", "Win32_System_Power", "Win32_Security_Cryptography", "Win32_System_Memory", "Win32_System_RemoteDesktop", "Win32_System_StationsAndDesktops", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_Security"] }
windows = { version = "0.62.2", features = ["Win32_Media_MediaFoundation", "Win32_Media_DirectShow", "Win32_System_Com", "Win32_System_LibraryLoader", "Win32_System_Variant", "Win32_System_Com_StructuredStorage", "Win32_UI_Accessibility", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi", "Win32_UI_Shell", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_Devices_Display"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
