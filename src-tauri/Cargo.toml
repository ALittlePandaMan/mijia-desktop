[package]
name = "mijia-desktop"
version = "0.1.0"
description = "Cross-platform desktop client for Xiaomi Home"
edition = "2021"
rust-version = "1.98"
license = "MIT"

[lib]
name = "mijia_desktop"
crate-type = ["rlib"]

[[bin]]
name = "mijia-desktop"
path = "src/main.rs"
required-features = ["desktop"]

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-build", "dep:tauri-plugin-dialog"]
ui-inspect = ["desktop"]

[build-dependencies]
tauri-build = { version = "2.7.4", optional = true, features = [] }

[dependencies]
tauri = { version = "2.12.5", optional = true, features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls", "json", "cookies"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
base64 = "0.22"
sha1 = "0.10"
sha2 = "0.10"
rand = "0.8"
url = "2"
uuid = { version = "1", features = ["v4"] }
keyring = { version = "3.6.3", default-features = false }
dirs = "=7.0.0"
tauri-plugin-dialog = { version = "=2.8.4", optional = true }
zeroize = "1"
ring = "0.17.14"
salsa20 = "0.10.2"
chacha20 = "0.9.1"
flate2 = "1"
aes = "0.8.4"
cbc = { version = "0.1.2", features = ["alloc"] }
md-5 = "0.10"
chrono = { version = "=0.4.45", default-features = false, features = ["clock", "std"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6.3", features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6.3", features = ["sync-secret-service", "crypto-rust"] }

[target.'cfg(windows)'.dependencies]
keyring = { version = "3.6.3", features = ["windows-native"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_NetworkManagement_WiFi", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock", "Win32_UI_Controls_Dialogs", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_System_Com"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
