name: Website

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/website.yml'
      - 'scripts/export-showcase.mjs'
      - 'src/**'
      - 'licenses/**'
      - 'docs/THIRD_PARTY_NOTICES.md'
      - 'LICENSE'
      - '.node-version'
  release:
    types: [published, edited, unpublished, deleted]
  workflow_run:
    workflows: [Release]
    types: [completed]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh-after-release:
    name: Queue Pages refresh on main
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      # Release refs are tags. The Pages environment accepts main only.
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run website.yml --repo "$GITHUB_REPOSITORY" --ref main

  build:
    name: Build and check website
    # GITHUB_TOKEN publishes automated releases, which do not emit a workflow-triggering release event.
    if: |
      github.event_name != 'release' &&
      (github.event_name != 'workflow_run' ||
        (github.event.workflow_run.conclusion == 'success' &&
         github.event.workflow_run.event == 'push' &&
         startsWith(github.event.workflow_run.head_branch, 'v')))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: website
    env:
      NEXT_PUBLIC_SITE_BASE_PATH: /mijia-desktop
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - name: Refresh public GitHub release and statistics
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run stats:sync -- --use-gh
      - run: npm run check
      - run: npm run build
      - run: npm run demo:check
      - run: npm run demo:cards:check
      - name: Check repository source boundaries
        working-directory: .
        run: node scripts/check-source.mjs
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: website/out

  deploy:
    name: Publish GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - id: pages
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
